# .github/workflows/pokemon-map.yml
#
# Captures the Gracidea live Pokemon map (https://gracidea.lecoq.io) and
# commits it to the repo root as metrics.gracidea.svg
#
# No secret needed: the screenshot plugin does not read GitHub data,
# so token: NOT_NEEDED is correct here.

name: Pokemon map

on:
  workflow_dispatch: # run it manually first!
  schedule: [{ cron: "0 23 * * 0" }] # then weekly, Monday 06:00 WIB

permissions:
  contents: write

jobs:
  gracidea:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Capture Gracidea live map
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: metrics.gracidea.svg
          base: ""
          template: classic
          plugin_screenshot: yes
          plugin_screenshot_title: "Gracidea - a Pokemon live map by @lowlighter"
          plugin_screenshot_url: https://gracidea.lecoq.io/
          plugin_screenshot_selector: canvas
          plugin_screenshot_mode: image
          plugin_screenshot_background: yes
          plugin_screenshot_wait: 15000
          plugin_screenshot_viewport: |
            {"width": 1000, "height": 480}

# ── Troubleshooting, in this order ─────────────────────────────────────────
# Blank / white image  -> plugin_screenshot_selector: body
# Map still loading    -> plugin_screenshot_wait: 25000
# Cropped too small    -> plugin_screenshot_viewport: {"width": 1200, "height": 560}
# Nothing works        -> use the manual screenshot fallback instead
